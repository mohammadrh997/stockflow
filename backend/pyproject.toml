[project]
name = "stockflow"
version = "0.1.0"
description = "Inventory API with stock ledger, purchase and sales orders"
readme = "README.md"
authors = [
    { name = "mohammad", email = "mohammadrh997@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.127",
    "fastapi[standard]>=0.143.5",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.5",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.127",
    "mypy>=2.4.0",
    "pypdf>=7.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.mypy]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]  # ships no type hints
ignore_missing_imports = true
